# Vets and builds the proxy on every PR and on main, then boots the real image
# against a local S3 bucket to check the S3 path end to end.
name: docker-build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go build ./...

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build proxy
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: false
          cache-from: type=gha,scope=proxy
          cache-to: type=gha,mode=max,scope=proxy

  # The proxy only earns its keep if it actually speaks SigV4 to a real bucket,
  # which the image build cannot show. Versity's S3 gateway stands in for Railway
  # Buckets; it verifies SigV4 like the real thing. MinIO no longer publishes images.
  proxy-behaviour:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Build proxy image locally
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: proxy:ci
          cache-from: type=gha,scope=proxy

      - name: Start an S3 gateway with an object in it
        run: |
          set -eu
          docker network create ci-net
          docker run -d --name s3gw --network ci-net \
            -e ROOT_ACCESS_KEY=ciaccesskey \
            -e ROOT_SECRET_KEY=cisecretkey \
            -p 9000:9000 \
            versity/versitygw:v1.8.0 --port :9000 posix /tmp/vgw
          # Any HTTP answer means it is up; anonymous requests get a 403.
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:9000/ && break
            sleep 1
          done
          printf 'hello from the bucket\n' > object.txt
          docker run --rm --network ci-net -v "$PWD:/w" -w /w \
            -e AWS_ACCESS_KEY_ID=ciaccesskey \
            -e AWS_SECRET_ACCESS_KEY=cisecretkey \
            -e AWS_DEFAULT_REGION=us-east-1 \
            --entrypoint sh amazon/aws-cli:2.37.2 -c '
              aws --endpoint-url http://s3gw:9000 s3 mb s3://public &&
              aws --endpoint-url http://s3gw:9000 s3 cp object.txt s3://public/dir/object.txt'

      - name: Start proxy
        run: |
          set -eu
          docker run -d --name proxy --network ci-net \
            -e AWS_ACCESS_KEY_ID=ciaccesskey \
            -e AWS_SECRET_ACCESS_KEY=cisecretkey \
            -e AWS_S3_BUCKET_NAME=public \
            -e AWS_ENDPOINT_URL=http://s3gw:9000 \
            -e AWS_DEFAULT_REGION=us-east-1 \
            -e S3_FORCE_PATH_STYLE=true \
            -e PORT=8080 \
            -p 8080:8080 proxy:ci
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:8080/ && break
            sleep 1
          done

      - name: Assertions
        run: |
          set -eu
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }

          echo "an existing object is streamed back anonymously"
          [ "$(code http://localhost:8080/dir/object.txt)" = 200 ]
          curl -s http://localhost:8080/dir/object.txt | grep -q 'hello from the bucket'

          echo "HEAD works and carries the cache header"
          curl -sI http://localhost:8080/dir/object.txt | grep -qi '^cache-control:'

          echo "a missing object is 404, not 502"
          [ "$(code http://localhost:8080/nope.txt)" = 404 ]

          echo "writes are refused"
          [ "$(code -X PUT --data x http://localhost:8080/dir/object.txt)" = 405 ]
          [ "$(code -X POST --data x http://localhost:8080/dir/object.txt)" = 405 ]
          [ "$(code -X DELETE http://localhost:8080/dir/object.txt)" = 405 ]

          echo "CORS headers are present"
          curl -sI http://localhost:8080/dir/object.txt | grep -qi '^access-control-allow-origin:'

          echo "a conditional request is 304, not 502"
          etag=$(curl -sI http://localhost:8080/dir/object.txt | tr -d '\r' | awk -F': ' '/^[Ee][Tt]ag/{print $2}')
          [ "$(code -H "If-None-Match: $etag" http://localhost:8080/dir/object.txt)" = 304 ]

      - name: Proxy logs on failure
        if: failure()
        run: |
          docker logs proxy || true
          docker logs s3gw || true
